#
# Embench-IoT board configuration for the CVA6 standalone testbench. bench.mk
# copies this directory to config/riscv32/boards/cva6tb in the Embench tree;
# build_all.py executes this file as Python with its own globals, so `os` is
# available. Paths and the compiler come from the environment bench.mk sets.
#
# The flags are those Philipp Schilk used for his CVA6S+ frontend evaluation
# (MSc thesis, 2025, Section 3.2.1), with three differences:
#  - -mcmodel=medany instead of medlow: the testbench DRAM is at 0x8000_0000,
#    which medlow cannot address on RV64.
#  - no --specs=nano.specs: the GCC 14.2 toolchain used here ships the specs
#    file but not the newlib-nano libraries, so the full newlib
#    (speed-optimised memcpy and memset) is linked instead.
#  - -fno-ipa-cp-clone: otherwise GCC compiles benchmark_body twice, a copy for
#    the warm-up and one specialised for the timed repetition count. The warm-up
#    then never runs the timed code, which starts cold in the I$, and the
#    specialised copy can drop work (nbody timed 445 instructions, not 21535).

cc = os.environ['BENCH_CC']

cflags = [
    '-c', '-fdata-sections', '-ffunction-sections',
    '-march=rv64gc_zifencei', '-mabi=lp64d', '-mcmodel=medany',
    '-O3', '-g', '-fno-tree-loop-distribute-patterns', '-funroll-all-loops',
    '-falign-jumps=4', '-falign-functions=16', '-fno-ipa-cp-clone',
    '-I' + os.environ['BENCH_INC_DIR'],
    '-I' + os.environ['BENCH_PRINTF_DIR'],
    os.environ['BENCH_PREFIX_MAP'],
]

ldflags = [
    '-Wl,--gc-sections', '-march=rv64gc_zifencei', '-mabi=lp64d', '-nostartfiles',
    '-T' + os.environ['BENCH_LINK_LD'],
]

# crt0.o is named explicitly: nothing references _start, so the linker would
# not pull it out of an archive.
user_libs = [os.environ['BENCH_CRT0'], os.environ['BENCH_LIB'], '-lm']

cpu_mhz = 1
warmup_heat = 1
