name: Slang

on: [ push, pull_request, workflow_dispatch ]

jobs:
  # Each PULP configuration elaborated as util/slang.sh does, its diagnostics
  # reported on the commit
  elaborate:
    runs-on: ubuntu-latest
    name: ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - cv64a6_imafdch_sv39_hpdcache_wb
          - cv64a6_imafdc_sv39_hpdcache_wb
          - cv64a6_splus
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # Skip on forks or pull requests from forks due to missing secrets.
    if: github.repository == 'pulp-platform/cva6' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7

      # Bender fetches the other dependencies
      - name: Checkout HPDCache
        run: git submodule update --init core/cache_subsystem/hpdcache

      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1

      - name: Write the file list
        id: flist
        run: echo "flags=$(util/slang.sh --flags ${{ matrix.config }})" >> $GITHUB_OUTPUT

      - name: Run slang
        uses: pulp-platform/pulp-actions/slang@v2.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewdog-name: slang-${{ matrix.config }}
          slang-flags: ${{ steps.flist.outputs.flags }}
