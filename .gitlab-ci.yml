stages:
  - nonfree

init:
  stage: nonfree
  script:
    - git clone git@iis-git.ee.ethz.ch:pulp-restricted/cva6-nonfree.git nonfree
    - cd nonfree && git checkout 62ec5b5f135c0f1c85d9f09d5c814940d2b4bbfe
  artifacts:
    paths: [ nonfree/ci.yml ]

subpipe:
  stage: nonfree
  needs: [ init ]
  trigger:
    include:
      - artifact: nonfree/ci.yml
        job: init
    strategy: depend
