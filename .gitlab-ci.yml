stages:
  - nonfree

init:
  stage: nonfree
  script:
    - git clone git@iis-git.ee.ethz.ch:pulp-restricted/cva6-nonfree.git nonfree
    - cd nonfree && git checkout 9494ccf9fd981788abbeb85527f864d8a7018c75
  artifacts:
    paths: [ nonfree/ci.yml ]

subpipe:
  stage: nonfree
  needs: [ init ]
  trigger:
    include:
      - artifact: nonfree/ci.yml
        job: init
    strategy: depend
