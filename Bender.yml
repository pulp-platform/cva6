package:
  name: cva6
  authors:
    - "Florian Zaruba <zarubaf@iis.ee.ethz.ch>"
    - "Michael Schaffner <schaffner@iis.ee.ethz.ch>"
    - "Andreas Kuster <kustera@ethz.ch>"

# WT_DCACHE
dependencies:
  axi:
    git: "https://github.com/pulp-platform/axi.git"
    version: 0.31.0
  common_cells:
    git: "https://github.com/pulp-platform/common_cells"
    version: 1.23.0
  fpnew:
    git: "https://github.com/openhwgroup/cvfpu.git"
    rev: 3eb6afe  # branch: develop
  hpdcache:
    git: "https://github.com/pulp-platform/cv-hpdcache.git"
    rev: openhw-master-candidate
    pass_targets: ["hpdcache_axi"]
  obi:
    git: "https://github.com/pulp-platform/obi.git"
    version: 0.1.7
  tech_cells_generic:
    git: "https://github.com/pulp-platform/tech_cells_generic.git"
    version: 0.2.13

export_include_dirs:
  - core/include

sources:
  - include_dirs:
      - core/include
    files:
      - core/include/config_pkg.sv
      # Pick the right configuration by passing the right bender flag. The
      # per-target packages live under config/target, which core/Flist.cva6
      # uses as the single source of truth for the flow.
      - target: cv32a60x
        files:
          - config/target/cv32a60x/rtl_cfg_pkg.sv

      - target: cv32a60x_no_zcmt
        files:
          - config/target/cv32a60x_no_zcmt/rtl_cfg_pkg.sv

      - target: cv32a65x
        files:
          - config/target/cv32a65x/rtl_cfg_pkg.sv

      - target: cv32a65x_sv32
        files:
          - config/target/cv32a65x_sv32/rtl_cfg_pkg.sv

      - target: cv32a6_imac_sv32
        files:
          - config/target/cv32a6_imac_sv32/rtl_cfg_pkg.sv

      - target: cv32a6_ima_sv32_fpga
        files:
          - config/target/cv32a6_ima_sv32_fpga/rtl_cfg_pkg.sv

      - target: cv64a6_imafdc_sv39_hpdcache_pmp_mmu_axi
        files:
          - config/target/cv64a6_imafdc_sv39_hpdcache_pmp_mmu_axi/rtl_cfg_pkg.sv

      - target: cv64a6_imafdc_sv39_hpdcache_wb
        files:
          - config/target/cv64a6_imafdc_sv39_hpdcache_wb/rtl_cfg_pkg.sv

      # General config infrastructure
      - core/include/riscv_pkg.sv
      - core/include/ariane_pkg.sv
      - core/include/build_config_pkg.sv

      # MMU
      - target: any(cv64a6_imafdcv_sv39, cv64a6_imafdc_sv39, cv64a6_imafdc_sv39_wb, cv64a6_imafdch_sv39, cv64a6_imafdch_sv39_wb, cv32a6_imac_sv0, cv32a6_imac_sv32, cv32a6_imafc_sv32)
        files:
          - core/cva6_mmu/cva6_tlb.sv
          - core/cva6_mmu/cva6_mmu.sv
          - core/cva6_mmu/cva6_ptw.sv
          - core/cva6_mmu/cva6_shared_tlb.sv

      # Packages
      - core/include/wt_cache_pkg.sv
      - core/include/aes_pkg.sv
      - core/include/triggers_pkg.sv
      - core/include/dummy_l15_pkg.sv

      # Extension Interface
      - core/cvxif_compressed_if_driver.sv
      - core/cvxif_issue_register_commit_if_driver.sv
      - core/cvxif_example/include/cvxif_instr_pkg.sv
      - core/cvxif_fu.sv
      - core/cvxif_example/cvxif_example_coprocessor.sv
      - core/cvxif_example/instr_decoder.sv
      - core/cvxif_example/compressed_instr_decoder.sv
      - core/cvxif_example/copro_alu.sv

      # Tracing
      - core/cva6_rvfi_probes.sv
      - core/cva6_fifo_v3.sv
      # Top-level source files (not necessarily instantiated at the top of the cva6).
      - core/cva6_example_obi.sv
      - core/cva6_example_axi.sv
      - core/cva6_top.sv
      - core/cva6.sv
      - core/cva6_pipeline.sv
      - core/alu.sv
      - core/alu_wrapper.sv
      - core/aes.sv
      - core/fpu_wrap.sv # depends on fpnew_pkg, above
      - core/branch_unit.sv
      - core/compressed_decoder.sv
      - core/macro_decoder.sv
      - core/controller.sv
      - core/zcmt_decoder.sv
      - core/csr_buffer.sv
      - core/csr_regfile.sv
      - core/trigger_module.sv
      - core/decoder.sv
      - core/ex_stage.sv
      - core/instr_realign.sv
      - core/id_stage.sv
      - core/issue_read_operands.sv
      - core/issue_stage.sv
      - core/load_unit.sv
      - core/load_store_unit.sv
      - core/lsu_bypass.sv
      - core/mult.sv
      - core/multiplier.sv
      - core/serdiv.sv
      - core/perf_counters.sv
      - core/ariane_regfile_ff.sv
      - core/ariane_regfile_fpga.sv
      - core/scoreboard.sv
      - core/raw_checker.sv
      - core/store_buffer.sv
      - core/amo_buffer.sv
      - core/store_unit.sv
      - core/commit_stage.sv
      - core/axi_shim.sv

      # Frontend (i.e., fetch, decode, dispatch)
      - core/frontend/btb.sv
      - core/frontend/bht.sv
      - core/frontend/bht2lvl.sv
      - core/frontend/ras.sv
      - core/frontend/instr_scan.sv
      - core/frontend/instr_queue.sv
      - core/frontend/frontend.sv
      # Cache subsystem(s)
      - core/cache_subsystem/cva6_obi_adapter_subsystem.sv
      - core/cache_subsystem/axi_adapter.sv
      - core/cache_subsystem/cva6_hpdcache_subsystem_l15_adapter.sv
      - core/cache_subsystem/cva6_hpdcache_subsystem.sv
      - core/cache_subsystem/cva6_hpdcache_subsystem_axi_arbiter.sv
      - core/cache_subsystem/cva6_hpdcache_if_adapter.sv
      - core/cache_subsystem/cva6_hpdcache_wrapper.sv
      - core/cache_subsystem/cva6_hpicache_if_adapter.sv
      - core/cache_subsystem/cva6_hpicache_wrapper.sv

      # Physical Memory Protection
      - core/pmp/src/pmp.sv
      - core/pmp/src/pmp_entry.sv
      - core/pmp/src/pmp_data_if.sv

      # DCLS (dual-core lockstep)
      - core/dcls_comparator.sv
      - core/dcls_logic.sv
      - core/dcls_common.sv
      - core/dcls_common_regfile.sv
      - core/dcls_common_bht.sv

      - include_dirs:
        - common/local/util
        files:
          - common/local/util/sram.sv
          - common/local/util/sram_cache.sv

      - target: not(all(fpga, xilinx))
        include_dirs:
          - common/local/util
        files:
          - common/local/util/tc_sram_wrapper.sv
          - common/local/util/tc_sram_wrapper_cache_techno.sv

      - target: all(fpga, xilinx)
        include_dirs:
          - common/local/util
        files:
          - common/local/util/tc_sram_fpga_wrapper.sv

      - target: not(synthesis)
        include_dirs:
          - core/include
          - common/local/util
        files:
          # Tracer (behavioral code, not RTL)
          - core/include/instr_tracer_pkg.sv
          - common/local/util/instr_tracer.sv
